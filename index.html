<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>五線譜學習網站</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --panel: #ffffff;
      --ink: #20242d;
      --muted: #667085;
      --line: #d7dce6;
      --brand: #2563eb;
      --brand-soft: #dbeafe;
      --ok: #15803d;
      --ok-soft: #dcfce7;
      --bad: #b42318;
      --bad-soft: #fee4e2;
      --shadow: 0 14px 40px rgba(22, 34, 58, 0.09);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 0%, rgba(37, 99, 235, 0.10), transparent 28rem),
        linear-gradient(180deg, #fbfcff 0%, var(--bg) 48%);
      font-family: "Microsoft JhengHei", "Noto Sans TC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .app {
      display: grid;
      grid-template-columns: 292px minmax(0, 1fr);
      gap: 20px;
      width: min(1220px, calc(100% - 32px));
      margin: 0 auto;
      padding: 22px 0;
    }

    .sidebar {
      position: sticky;
      top: 18px;
      align-self: start;
      max-height: calc(100vh - 36px);
      overflow: auto;
      padding: 18px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .brand {
      margin-bottom: 18px;
    }

    .brand h1 {
      margin: 0 0 6px;
      font-size: 24px;
      letter-spacing: 0;
    }

    .brand p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .control-group {
      padding: 14px 0;
      border-top: 1px solid var(--line);
    }

    .control-title {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      color: #303846;
      font-size: 14px;
      font-weight: 700;
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      padding: 4px;
      background: #edf1f7;
      border-radius: 8px;
    }

    .segmented button,
    .choice-btn,
    .action-btn {
      border: 0;
      cursor: pointer;
      border-radius: 7px;
      transition: transform 0.12s ease, background 0.12s ease, color 0.12s ease, box-shadow 0.12s ease;
    }

    .segmented button {
      min-height: 38px;
      color: #485367;
      background: transparent;
      font-weight: 700;
    }

    .segmented button.active {
      color: var(--brand);
      background: #fff;
      box-shadow: 0 2px 8px rgba(31, 41, 55, 0.08);
    }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .choice-btn {
      min-height: 38px;
      padding: 7px 9px;
      color: #3f4a5d;
      background: #f3f6fb;
      border: 1px solid #e2e7f0;
      font-weight: 700;
    }

    .choice-btn.active {
      color: var(--brand);
      background: var(--brand-soft);
      border-color: #93c5fd;
    }

    .range-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--brand);
    }

    .range-value {
      min-width: 70px;
      padding: 5px 8px;
      text-align: center;
      color: var(--brand);
      background: var(--brand-soft);
      border-radius: 7px;
      font-weight: 800;
    }

    .note-checkboxes {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .note-checkboxes label {
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 34px;
      padding: 6px 8px;
      background: #f8fafc;
      border: 1px solid #e6ebf3;
      border-radius: 7px;
      font-size: 14px;
      cursor: pointer;
    }

    .note-checkboxes input {
      accent-color: var(--brand);
    }

    .main {
      min-width: 0;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
      padding: 16px 18px;
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .topbar h2 {
      margin: 0 0 4px;
      font-size: 22px;
    }

    .topbar p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .stat {
      min-width: 92px;
      padding: 8px 10px;
      text-align: center;
      background: #f8fafc;
      border: 1px solid #e7ebf2;
      border-radius: 8px;
    }

    .stat strong {
      display: block;
      font-size: 20px;
    }

    .stat span {
      color: var(--muted);
      font-size: 12px;
    }

    .stage {
      padding: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .practice-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .practice-toolbar .segmented {
      width: min(360px, 100%);
    }

    .staff-wrap {
      position: relative;
      overflow: hidden;
      border: 1px solid #e5eaf2;
      border-radius: 8px;
      background: linear-gradient(180deg, #fff 0%, #fbfdff 100%);
    }

    .staff-svg {
      display: block;
      width: 100%;
      min-width: 0;
      height: 360px;
    }

    .label-toggle {
      position: absolute;
      left: 10px;
      bottom: 10px;
      z-index: 2;
      display: flex;
      gap: 3px;
      padding: 4px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid #d8deea;
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(31, 41, 55, 0.12);
    }

    .label-toggle button {
      min-height: 30px;
      padding: 4px 8px;
      border: 0;
      border-radius: 6px;
      color: #475467;
      background: transparent;
      cursor: pointer;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .label-toggle button.active {
      color: var(--brand);
      background: var(--brand-soft);
    }

    .feedback {
      min-height: 44px;
      margin-top: 14px;
      padding: 10px 12px;
      color: #3b4554;
      background: #f8fafc;
      border: 1px solid #e5eaf2;
      border-radius: 8px;
      font-weight: 700;
    }

    .feedback.ok {
      color: var(--ok);
      background: var(--ok-soft);
      border-color: #86efac;
    }

    .feedback.bad {
      color: var(--bad);
      background: var(--bad-soft);
      border-color: #fda29b;
    }

    .action-row {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .action-btn {
      min-height: 40px;
      padding: 8px 14px;
      color: #fff;
      background: var(--brand);
      font-weight: 800;
    }

    .action-btn.secondary {
      color: #344054;
      background: #eef2f7;
    }

    .action-btn.stop {
      color: var(--bad);
      background: var(--bad-soft);
    }

    .keyboard-panel {
      margin-top: 16px;
      padding: 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .keyboard-title {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .keyboard {
      position: relative;
      min-height: 178px;
      overflow-x: auto;
      padding-bottom: 4px;
      border-bottom: 8px solid #c6ceda;
      background: linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
      border-radius: 8px 8px 4px 4px;
    }

    .keyboard-inner {
      position: relative;
      min-height: 166px;
    }

    .piano-key {
      position: relative;
      border: 0;
      cursor: pointer;
      font: inherit;
    }

    .white-key {
      position: absolute;
      top: 0;
      width: 54px;
      height: 160px;
      border: 1px solid #aeb7c5;
      border-bottom: 5px solid #8f99a8;
      border-radius: 0 0 8px 8px;
      background: linear-gradient(90deg, #f3f5f8 0%, #ffffff 12%, #ffffff 68%, #e9edf3 100%);
      color: #1f2937;
      box-shadow: inset -4px 0 8px rgba(15, 23, 42, 0.08), inset 2px 0 5px rgba(255, 255, 255, 0.8);
    }

    .black-key {
      position: absolute;
      top: 0;
      z-index: 2;
      width: 34px;
      height: 102px;
      border: 1px solid #020617;
      border-bottom: 5px solid #000;
      border-radius: 0 0 6px 6px;
      background: linear-gradient(90deg, #111827 0%, #020617 42%, #1f2937 100%);
      color: #fff;
      box-shadow: 0 7px 11px rgba(15, 23, 42, 0.38), inset -3px 0 5px rgba(255, 255, 255, 0.08);
    }

    .piano-key:active,
    .piano-key.pressed {
      transform: translateY(2px);
    }

    .white-key:active,
    .white-key.pressed {
      background: linear-gradient(180deg, #dbeafe 0%, #f8fbff 100%);
      border-color: #60a5fa;
      border-bottom-width: 3px;
    }

    .black-key:active,
    .black-key.pressed {
      background: linear-gradient(180deg, #1d4ed8 0%, #1e3a8a 100%);
      border-color: #1e3a8a;
      border-bottom-width: 3px;
    }

    .key-label {
      position: absolute;
      right: 6px;
      bottom: 8px;
      left: 6px;
      text-align: center;
      font-weight: 900;
    }

    .key-octave {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .black-key .key-label {
      right: 3px;
      bottom: 9px;
      left: 3px;
      color: #f8fafc;
      font-size: 12px;
      line-height: 1.1;
    }

    .black-key .key-octave {
      color: #cbd5e1;
      font-size: 10px;
    }

    .learn-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .learn-card {
      padding: 8px 10px;
      border: 1px solid #e5eaf2;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
    }

    .learn-card svg {
      display: none;
    }

    .learn-card strong {
      display: inline;
      font-size: 15px;
    }

    .learn-card span {
      margin-left: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .learn-note {
      cursor: pointer;
    }

    .learn-note:focus-visible ellipse {
      outline: none;
      stroke: var(--brand);
      stroke-width: 4;
    }

    .empty {
      padding: 18px;
      color: var(--muted);
      text-align: center;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      background: #f8fafc;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 860px) {
      .app {
        grid-template-columns: 1fr;
        width: min(100% - 12px, 720px);
        padding: 10px 0 18px;
      }

      .sidebar {
        position: static;
        max-height: none;
        padding: 14px;
      }

      .choice-grid,
      .note-checkboxes {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
        padding: 14px;
      }

      .stats {
        justify-content: flex-start;
      }

      .staff-svg {
        height: 300px;
      }

      .stage {
        padding: 10px;
      }

      .practice-toolbar {
        align-items: stretch;
        flex-direction: column;
      }

      .practice-toolbar .segmented {
        width: 100%;
      }

      .label-toggle {
        right: 8px;
        bottom: 8px;
        left: 8px;
        justify-content: space-between;
      }

      .label-toggle button {
        flex: 1;
        padding: 5px 4px;
      }

      .learn-grid {
        gap: 6px;
      }

      .learn-card {
        padding: 7px 8px;
      }

      .white-key {
        width: 54px;
      }

      .black-key {
        width: 34px;
        height: 88px;
      }
    }

    @media (max-width: 520px) {
      .brand h1 {
        font-size: 21px;
      }

      .choice-grid,
      .note-checkboxes {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        width: 100%;
      }

      .stat {
        min-width: 0;
      }

      .staff-svg {
        height: 260px;
      }

      .keyboard {
        min-height: 146px;
      }

      .keyboard-inner {
        min-height: 138px;
      }

      .white-key {
        width: 54px;
        height: 124px;
      }

      .black-key {
        width: 34px;
        height: 78px;
      }

      .key-label {
        font-size: 13px;
      }

      .black-key .key-label {
        font-size: 10px;
      }

    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="功能選單">
      <div class="brand">
        <h1>五線譜學習</h1>
        <p>看音符，點鋼琴鍵。先從白鍵與 Do Re Mi 開始，慢慢把位置感練起來。</p>
      </div>

      <section class="control-group">
        <div class="control-title">譜號版本</div>
        <div class="segmented" role="tablist" aria-label="選擇譜號">
          <button type="button" class="active" data-clef="treble">高音譜記號</button>
          <button type="button" data-clef="bass">低音譜記號</button>
        </div>
      </section>

      <section class="control-group">
        <div class="control-title">功能模式</div>
        <div class="segmented" role="tablist" aria-label="選擇模式">
          <button type="button" class="active" data-mode="practice">練習</button>
          <button type="button" data-mode="learn">學習</button>
        </div>
      </section>

      <section class="control-group">
        <div class="control-title">音符篩選</div>
        <div class="choice-grid" aria-label="音符篩選">
          <button type="button" class="choice-btn active" data-filter="all">全部</button>
          <button type="button" class="choice-btn" data-filter="line">線上音符</button>
          <button type="button" class="choice-btn" data-filter="space">間上音符</button>
          <button type="button" class="choice-btn" data-filter="custom">自訂音符</button>
        </div>
      </section>

      <section class="control-group">
        <div class="control-title">
          <span>音域加線範圍</span>
          <span class="range-value" id="rangeValue">上下 1 線</span>
        </div>
        <div class="range-row">
          <input type="range" id="ledgerRange" min="0" max="5" value="1" aria-label="上下加線範圍">
        </div>
      </section>

      <section class="control-group">
        <div class="control-title">自訂音符</div>
        <div class="note-checkboxes" id="noteOptions"></div>
      </section>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h2 id="pageTitle">高音譜記號練習</h2>
          <p id="pageSubtitle">請看上方音符，並在下方鋼琴鍵盤點出相同音。</p>
        </div>
        <div class="stats" aria-label="練習統計">
          <div class="stat">
            <strong id="scoreText">0</strong>
            <span>答對</span>
          </div>
          <div class="stat">
            <strong id="tryText">0</strong>
            <span>作答</span>
          </div>
          <div class="stat">
            <strong id="poolText">0</strong>
            <span>題庫音符</span>
          </div>
        </div>
      </header>

      <section class="stage" aria-label="五線譜">
        <div class="practice-toolbar" id="practiceToolbar">
          <div class="segmented" role="tablist" aria-label="選擇練習題型">
            <button type="button" class="active" data-practice-type="single">單音練習</button>
            <button type="button" data-practice-type="melody">旋律練習</button>
          </div>
        </div>
        <div class="staff-wrap">
          <svg class="staff-svg" id="staffSvg" viewBox="0 0 900 360" role="img" aria-label="五線譜題目"></svg>
          <div class="label-toggle" id="labelToggle" aria-label="切換音名顯示">
            <button type="button" class="active" data-label-mode="both">音名+唱名</button>
            <button type="button" data-label-mode="letter">音名</button>
            <button type="button" data-label-mode="solfege">唱名</button>
            <button type="button" data-label-mode="none">隱藏</button>
          </div>
        </div>
        <div class="feedback" id="feedback">準備好了就點下方鋼琴鍵開始作答。</div>
        <div class="action-row">
          <button type="button" class="action-btn secondary" id="resetBtn">重設分數</button>
          <button type="button" class="action-btn" id="nextBtn">換一題</button>
          <button type="button" class="action-btn secondary hidden" id="generateMelodyBtn">產生旋律</button>
          <button type="button" class="action-btn hidden" id="playMelodyBtn">播放旋律</button>
          <button type="button" class="action-btn stop hidden" id="stopMelodyBtn">停止播放</button>
        </div>
        <div class="learn-grid hidden" id="learnGrid" aria-label="學習音符列表"></div>
      </section>

      <section class="keyboard-panel" id="keyboardPanel" aria-label="鋼琴鍵盤">
        <div class="keyboard-title">
          <strong>鋼琴鍵盤</strong>
          <span id="keyboardHint">點擊對應的 Do Re Mi 鍵</span>
        </div>
        <div class="keyboard" id="keyboard"></div>
      </section>
    </main>
  </div>

  <script>
    const STEP = 14;
    const STAFF_TOP = 112;
    const STAFF_LEFT = 165;
    const STAFF_RIGHT = 820;
    const STAFF_WIDTH = STAFF_RIGHT - STAFF_LEFT;
    const NOTE_X = 475;
    const SOLFEGE = ["Do", "Re", "Mi", "Fa", "Sol", "La", "Si"];
    const LETTER_TO_SOLFEGE = {
      C: "Do",
      D: "Re",
      E: "Mi",
      F: "Fa",
      G: "Sol",
      A: "La",
      B: "Si"
    };
    const LETTER_TO_FIXED_DO = {
      C: "Do",
      D: "Re",
      E: "Mi",
      F: "Fa",
      G: "Sol",
      A: "La",
      B: "Si"
    };
    const CLEFS = {
      treble: {
        label: "高音譜記號",
        symbol: "𝄞",
        bottomMidi: 64,
        symbolX: 78,
        symbolY: 217,
        symbolSize: 118
      },
      bass: {
        label: "低音譜記號",
        symbol: "𝄢",
        bottomMidi: 43,
        symbolX: 80,
        symbolY: 188,
        symbolSize: 92
      }
    };
    const MIDI_BY_LETTER = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
    const LETTER_INDEX = { C: 0, D: 1, E: 2, F: 3, G: 4, A: 5, B: 6 };
    const CHROMATIC_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    const WHITE_KEY_WIDTH = 54;
    const BLACK_KEY_WIDTH = 34;
    const PIANO_SAMPLE_BASE = "assets/piano/";
    const PIANO_SAMPLE_MIDIS = [
      21, 24, 27, 30, 33, 36, 39, 42, 45, 48,
      51, 54, 57, 60, 63, 66, 69, 72, 75, 78,
      81, 84, 87, 90, 93, 96, 99, 102, 105, 108
    ];

    const state = {
      clef: "treble",
      mode: "practice",
      filter: "all",
      ledger: 1,
      selectedClasses: new Set(SOLFEGE),
      current: null,
      score: 0,
      tries: 0,
      timer: null,
      audioContext: null,
      sampleBuffers: new Map(),
      samplePromises: new Map(),
      labelMode: "both",
      practiceType: "single",
      melody: [],
      melodyIndex: 0,
      playbackTimers: [],
      playbackIndex: null,
      isPlayingMelody: false
    };

    const els = {
      staffSvg: document.getElementById("staffSvg"),
      feedback: document.getElementById("feedback"),
      keyboard: document.getElementById("keyboard"),
      keyboardPanel: document.getElementById("keyboardPanel"),
      keyboardHint: document.getElementById("keyboardHint"),
      learnGrid: document.getElementById("learnGrid"),
      noteOptions: document.getElementById("noteOptions"),
      range: document.getElementById("ledgerRange"),
      rangeValue: document.getElementById("rangeValue"),
      pageTitle: document.getElementById("pageTitle"),
      pageSubtitle: document.getElementById("pageSubtitle"),
      scoreText: document.getElementById("scoreText"),
      tryText: document.getElementById("tryText"),
      poolText: document.getElementById("poolText"),
      nextBtn: document.getElementById("nextBtn"),
      resetBtn: document.getElementById("resetBtn"),
      labelToggle: document.getElementById("labelToggle"),
      practiceToolbar: document.getElementById("practiceToolbar"),
      generateMelodyBtn: document.getElementById("generateMelodyBtn"),
      playMelodyBtn: document.getElementById("playMelodyBtn"),
      stopMelodyBtn: document.getElementById("stopMelodyBtn")
    };

    function midiToName(midi) {
      const octave = Math.floor(midi / 12) - 1;
      const letter = Object.keys(MIDI_BY_LETTER).find(key => MIDI_BY_LETTER[key] === midi % 12);
      return {
        letter,
        octave,
        solfege: LETTER_TO_SOLFEGE[letter],
        key: `${letter}${octave}`
      };
    }

    function midiToKeyboardNote(midi) {
      const octave = Math.floor(midi / 12) - 1;
      const pitch = midi % 12;
      const name = CHROMATIC_NAMES[pitch];
      const isBlack = name.includes("#");
      const letter = isBlack ? name : Object.keys(MIDI_BY_LETTER).find(key => MIDI_BY_LETTER[key] === pitch);
      return {
        midi,
        octave,
        letter,
        solfege: isBlack ? name : LETTER_TO_SOLFEGE[letter],
        key: `${name}${octave}`,
        isBlack,
        display: name
      };
    }

    function diatonicNumber(note) {
      return note.octave * 7 + LETTER_INDEX[note.letter];
    }

    function whiteMidiRange(start, end) {
      const notes = [];
      for (let midi = start; midi <= end; midi += 1) {
        if (Object.values(MIDI_BY_LETTER).includes(midi % 12)) {
          notes.push(midi);
        }
      }
      return notes;
    }

    function clefNotes(clefName) {
      const clef = CLEFS[clefName];
      const bottomNote = midiToName(clef.bottomMidi);
      const bottomDiatonic = diatonicNumber(bottomNote);
      return whiteMidiRange(clef.bottomMidi - 12, clef.bottomMidi + 20).map(midi => {
        const name = midiToName(midi);
        const staffIndex = diatonicNumber(name) - bottomDiatonic;
        return {
          ...name,
          midi,
          clef: clefName,
          staffIndex,
          staffType: staffIndex % 2 === 0 ? "line" : "space"
        };
      });
    }

    function visibleNotes() {
      const minIndex = -state.ledger * 2;
      const maxIndex = 8 + state.ledger * 2;
      return clefNotes(state.clef).filter(note => {
        const inRange = note.staffIndex >= minIndex && note.staffIndex <= maxIndex;
        const byKind = state.filter === "all" || state.filter === "custom" || note.staffType === state.filter;
        const byCustom = state.filter !== "custom" || state.selectedClasses.has(note.solfege);
        return inRange && byKind && byCustom;
      });
    }

    function rangeNotes() {
      const minIndex = -state.ledger * 2;
      const maxIndex = 8 + state.ledger * 2;
      return clefNotes(state.clef).filter(note => note.staffIndex >= minIndex && note.staffIndex <= maxIndex);
    }

    function keyboardNotes() {
      const notes = rangeNotes();
      if (!notes.length) return [];
      const minMidi = Math.min(...notes.map(note => note.midi));
      const maxMidi = Math.max(...notes.map(note => note.midi));
      const result = [];
      for (let midi = minMidi; midi <= maxMidi; midi += 1) {
        result.push(midiToKeyboardNote(midi));
      }
      return result;
    }

    function yForIndex(index) {
      return STAFF_TOP + (8 - index) * STEP;
    }

    function staffLineY(lineNumber) {
      return STAFF_TOP + lineNumber * STEP * 2;
    }

    function createSvgElement(tag, attrs = {}, text = "") {
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      Object.entries(attrs).forEach(([key, value]) => el.setAttribute(key, value));
      if (text) el.textContent = text;
      return el;
    }

    function labelParts(note) {
      if (state.labelMode === "letter") return [note.letter];
      if (state.labelMode === "solfege") return [note.solfege];
      if (state.labelMode === "none") return [];
      return [note.letter, note.solfege];
    }

    function nearestNote(notes, targetMidi) {
      if (!notes.length) return null;
      return notes.reduce((best, note) => {
        const bestDistance = Math.abs(best.midi - targetMidi);
        const noteDistance = Math.abs(note.midi - targetMidi);
        return noteDistance < bestDistance ? note : best;
      }, notes[0]);
    }

    function rhythmForMeasure(index) {
      const templates = [
        [1, 1, 1, 1],
        [1, 1, 2],
        [2, 1, 1],
        [1, 2, 1],
        [2, 2]
      ];
      return templates[index % templates.length];
    }

    function generateMelody() {
      stopMelodyPlayback();
      const selectedPool = visibleNotes().sort((a, b) => a.midi - b.midi);
      const fullPool = rangeNotes().sort((a, b) => a.midi - b.midi);
      const sourcePool = selectedPool.length ? selectedPool : fullPool;
      if (!sourcePool.length) {
        state.melody = [];
        state.melodyIndex = 0;
        state.current = null;
        els.feedback.className = "feedback bad";
        els.feedback.textContent = "目前沒有可用音符，請調整音域或音符篩選。";
        return;
      }

      const rhythms = [];
      for (let measure = 0; measure < 4; measure += 1) {
        let beat = 0;
        rhythmForMeasure(measure).forEach(duration => {
          rhythms.push({ measure, beat, duration });
          beat += duration;
        });
      }

      const requiredPoolCount = Math.ceil(rhythms.length * 0.7);
      const contour = [0, 1, 2, 1, 0, 2, 3, 2, 1, 0, -1, 0, 1, 0];
      const middle = sourcePool[Math.floor(sourcePool.length / 2)];
      const melody = rhythms.map((slot, index) => {
        const shouldUseSelected = index < requiredPoolCount || selectedPool.length < 2 || Math.random() < 0.82;
        const target = middle.midi + contour[index % contour.length] * 2;
        const note = nearestNote(shouldUseSelected ? sourcePool : fullPool, target) || middle;
        return {
          ...slot,
          note,
          fromSelected: selectedPool.some(poolNote => poolNote.key === note.key)
        };
      });

      while (selectedPool.length && melody.filter(item => item.fromSelected).length / melody.length < 0.7) {
        const replaceIndex = melody.findIndex(item => !item.fromSelected);
        if (replaceIndex < 0) break;
        melody[replaceIndex].note = nearestNote(selectedPool, melody[replaceIndex].note.midi);
        melody[replaceIndex].fromSelected = true;
      }

      state.melody = melody;
      state.melodyIndex = 0;
      state.current = melody[0].note;
      renderMelodyStaff();
      els.feedback.className = "feedback";
      const fitRate = Math.round((melody.filter(item => item.fromSelected).length / melody.length) * 100);
      els.feedback.textContent = `已產生 4 小節旋律，${fitRate}% 音符符合目前篩選。可以先播放旋律，再依序彈奏。`;
    }

    function stopMelodyPlayback() {
      state.playbackTimers.forEach(timer => clearTimeout(timer));
      state.playbackTimers = [];
      state.isPlayingMelody = false;
      state.playbackIndex = null;
    }

    function ensureAudioContext() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) {
        els.feedback.className = "feedback bad";
        els.feedback.textContent = "這個瀏覽器不支援音訊播放。";
        return null;
      }
      if (!state.audioContext) {
        state.audioContext = new AudioContextClass();
      }
      if (state.audioContext.state === "suspended") {
        state.audioContext.resume();
      }
      return state.audioContext;
    }

    async function playMelody() {
      if (!state.melody.length) {
        generateMelody();
      }
      if (!state.melody.length) return;
      stopMelodyPlayback();
      const context = ensureAudioContext();
      if (!context) return;
      els.feedback.className = "feedback";
      els.feedback.textContent = "正在載入鋼琴取樣音色...";
      const neededSamples = [...new Set(state.melody.map(item => nearestSampleMidi(item.note.midi)))];
      await Promise.all(neededSamples.map(midi => loadPianoSample(context, midi)));
      state.isPlayingMelody = true;
      let elapsed = 0;
      const beatMs = 520;
      state.melody.forEach((item, index) => {
        const timer = setTimeout(() => {
          state.playbackIndex = index;
          playNote(item.note, Math.max(0.45, item.duration * beatMs / 1000));
          renderMelodyStaff();
          if (index === state.melody.length - 1) {
            const doneTimer = setTimeout(() => {
              state.isPlayingMelody = false;
              state.playbackIndex = null;
              renderMelodyStaff();
            }, item.duration * beatMs);
            state.playbackTimers.push(doneTimer);
          }
        }, elapsed);
        state.playbackTimers.push(timer);
        elapsed += item.duration * beatMs;
      });
      els.feedback.className = "feedback ok";
      els.feedback.textContent = "正在播放旋律示範，跟著聽每個音的位置。";
    }

    function sampleFileName(midi) {
      const octave = Math.floor(midi / 12) - 1;
      const name = CHROMATIC_NAMES[midi % 12].replace("#", "s");
      return `${name}${octave}v8.ogg`;
    }

    function nearestSampleMidi(midi) {
      return PIANO_SAMPLE_MIDIS.reduce((best, sampleMidi) => {
        const bestDistance = Math.abs(best - midi);
        const sampleDistance = Math.abs(sampleMidi - midi);
        return sampleDistance < bestDistance ? sampleMidi : best;
      }, PIANO_SAMPLE_MIDIS[0]);
    }

    function loadPianoSample(context, sampleMidi) {
      if (state.sampleBuffers.has(sampleMidi)) {
        return Promise.resolve(state.sampleBuffers.get(sampleMidi));
      }
      if (state.samplePromises.has(sampleMidi)) {
        return state.samplePromises.get(sampleMidi);
      }
      const promise = fetch(`${PIANO_SAMPLE_BASE}${sampleFileName(sampleMidi)}`)
        .then(response => {
          if (!response.ok) throw new Error(`Sample ${sampleMidi} failed`);
          return response.arrayBuffer();
        })
        .then(arrayBuffer => context.decodeAudioData(arrayBuffer))
        .then(buffer => {
          state.sampleBuffers.set(sampleMidi, buffer);
          return buffer;
        })
        .catch(error => {
          state.samplePromises.delete(sampleMidi);
          console.warn("Piano sample unavailable; using synthesized fallback.", error);
          return null;
        });
      state.samplePromises.set(sampleMidi, promise);
      return promise;
    }

    function startSampledPiano(note, lengthSeconds, context, now) {
      const sampleMidi = nearestSampleMidi(note.midi);
      const buffer = state.sampleBuffers.get(sampleMidi);
      if (!buffer) {
        loadPianoSample(context, sampleMidi);
        return false;
      }

      const source = context.createBufferSource();
      const gain = context.createGain();
      const tone = context.createBiquadFilter();
      const releaseStart = Math.max(0.18, Math.min(lengthSeconds, 1.4));
      const releaseEnd = Math.min(buffer.duration / Math.pow(2, (note.midi - sampleMidi) / 12), releaseStart + 1.15);

      source.buffer = buffer;
      source.playbackRate.setValueAtTime(Math.pow(2, (note.midi - sampleMidi) / 12), now);
      tone.type = "lowpass";
      tone.frequency.setValueAtTime(Math.min(7600, 1800 + note.midi * 72), now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.92, now + 0.006);
      gain.gain.exponentialRampToValueAtTime(0.36, now + 0.12);
      gain.gain.setValueAtTime(0.36, now + releaseStart);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + releaseEnd);
      source.connect(tone);
      tone.connect(gain);
      gain.connect(context.destination);
      source.start(now);
      source.stop(now + releaseEnd + 0.04);
      return true;
    }

    function playNote(note, lengthSeconds = 1.7) {
      const context = ensureAudioContext();
      if (!context) return;

      const now = context.currentTime;
      if (startSampledPiano(note, lengthSeconds, context, now)) {
        return;
      }

      const fundamental = 440 * Math.pow(2, (note.midi - 69) / 12);
      const registerFactor = Math.max(0, Math.min(1, (note.midi - 36) / 48));
      const decay = Math.max(0.55, Math.min(2.8, lengthSeconds * 0.9 + 1.45 - registerFactor * 0.85));
      const master = context.createGain();
      const filter = context.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.setValueAtTime(Math.min(7600, fundamental * 14), now);
      filter.frequency.exponentialRampToValueAtTime(Math.max(1150, fundamental * 5.4), now + decay * 0.72);
      master.gain.setValueAtTime(0.0001, now);
      master.gain.exponentialRampToValueAtTime(0.48, now + 0.004);
      master.gain.exponentialRampToValueAtTime(0.18, now + 0.09);
      master.gain.exponentialRampToValueAtTime(0.0001, now + decay);
      master.connect(filter);
      filter.connect(context.destination);

      [
        { multiple: 1, gain: 1, detune: 0, type: "triangle" },
        { multiple: 2.01, gain: 0.42, detune: 2, type: "sine" },
        { multiple: 2.99, gain: 0.24, detune: -3, type: "sine" },
        { multiple: 4.03, gain: 0.13, detune: 4, type: "sine" },
        { multiple: 5.04, gain: 0.07, detune: -5, type: "sine" },
        { multiple: 6.05, gain: 0.035, detune: 6, type: "sine" }
      ].forEach(partial => {
        const oscillator = context.createOscillator();
        const partialGain = context.createGain();
        oscillator.type = partial.type;
        oscillator.frequency.setValueAtTime(fundamental * partial.multiple, now);
        oscillator.detune.setValueAtTime(partial.detune, now);
        partialGain.gain.setValueAtTime(0.0001, now);
        partialGain.gain.exponentialRampToValueAtTime(partial.gain, now + 0.003);
        partialGain.gain.exponentialRampToValueAtTime(partial.gain * 0.38, now + 0.08);
        partialGain.gain.exponentialRampToValueAtTime(0.0001, now + decay * (1 - partial.gain * 0.1));
        oscillator.connect(partialGain);
        partialGain.connect(master);
        oscillator.start(now);
        oscillator.stop(now + decay + 0.08);
      });

      const chorus = context.createOscillator();
      const chorusGain = context.createGain();
      chorus.type = "triangle";
      chorus.frequency.setValueAtTime(fundamental * 1.0025, now);
      chorusGain.gain.setValueAtTime(0.0001, now);
      chorusGain.gain.exponentialRampToValueAtTime(0.18, now + 0.006);
      chorusGain.gain.exponentialRampToValueAtTime(0.0001, now + decay * 0.92);
      chorus.connect(chorusGain);
      chorusGain.connect(master);
      chorus.start(now);
      chorus.stop(now + decay);

      const noiseDuration = 0.035;
      const noiseBuffer = context.createBuffer(1, Math.ceil(context.sampleRate * noiseDuration), context.sampleRate);
      const noiseData = noiseBuffer.getChannelData(0);
      for (let i = 0; i < noiseData.length; i += 1) {
        const fade = 1 - i / noiseData.length;
        noiseData[i] = (Math.random() * 2 - 1) * fade;
      }
      const hammer = context.createBufferSource();
      const hammerGain = context.createGain();
      const hammerFilter = context.createBiquadFilter();
      hammer.buffer = noiseBuffer;
      hammerFilter.type = "bandpass";
      hammerFilter.frequency.setValueAtTime(Math.min(5200, Math.max(850, fundamental * 9)), now);
      hammerFilter.Q.setValueAtTime(2.1, now);
      hammerGain.gain.setValueAtTime(0.12 + registerFactor * 0.08, now);
      hammerGain.gain.exponentialRampToValueAtTime(0.0001, now + noiseDuration);
      hammer.connect(hammerFilter);
      hammerFilter.connect(hammerGain);
      hammerGain.connect(filter);
      hammer.start(now);
      hammer.stop(now + noiseDuration);
    }

    function renderStaff(note, options = {}) {
      const { small = false, showLabel = false } = options;
      const svg = small ? createSvgElement("svg", { viewBox: "0 0 240 120" }) : els.staffSvg;
      svg.innerHTML = "";
      if (!small) {
        svg.setAttribute("viewBox", "0 0 900 360");
        svg.style.minWidth = "";
      }
      const left = small ? 38 : STAFF_LEFT;
      const right = small ? 214 : STAFF_RIGHT;
      const top = small ? 26 : STAFF_TOP;
      const step = small ? 6 : STEP;
      const noteX = small ? 128 : NOTE_X;
      const noteY = top + (8 - note.staffIndex) * step;
      const clef = CLEFS[note.clef];

      for (let i = 0; i < 5; i += 1) {
        const y = top + i * step * 2;
        svg.appendChild(createSvgElement("line", {
          x1: left,
          y1: y,
          x2: right,
          y2: y,
          stroke: "#111827",
          "stroke-width": small ? 1.4 : 2
        }));
      }

      if (!small) {
        svg.appendChild(createSvgElement("text", {
          x: clef.symbolX,
          y: clef.symbolY,
          "font-size": clef.symbolSize,
          "font-family": "Georgia, 'Times New Roman', serif",
          fill: "#111827"
        }, clef.symbol));
      } else {
        svg.appendChild(createSvgElement("text", {
          x: 8,
          y: 82,
          "font-size": note.clef === "treble" ? 52 : 42,
          "font-family": "Georgia, 'Times New Roman', serif",
          fill: "#111827"
        }, clef.symbol));
      }

      drawLedgerLines(svg, note.staffIndex, noteX, small ? 22 : 82, top, step);
      svg.appendChild(createSvgElement("ellipse", {
        cx: noteX,
        cy: noteY,
        rx: small ? 10 : 21,
        ry: small ? 7 : 14,
        transform: `rotate(-18 ${noteX} ${noteY})`,
        fill: "#111827"
      }));

      if (!small) {
        svg.appendChild(createSvgElement("text", {
          x: NOTE_X,
          y: 48,
          "text-anchor": "middle",
          "font-size": 22,
          "font-weight": 800,
          fill: "#344054"
        }, state.mode === "practice" ? "這個音要按哪一個琴鍵？" : "目前篩選出的音符"));
      }

      if (showLabel) {
        svg.appendChild(createSvgElement("text", {
          x: 128,
          y: 114,
          "text-anchor": "middle",
          "font-size": 14,
          "font-weight": 800,
          fill: "#2563eb"
        }, `${note.solfege} ${note.octave}`));
      }

      if (small) return svg;
    }

    function renderLearnStaff(notes) {
      const svg = els.staffSvg;
      svg.innerHTML = "";
      const width = 900;
      const left = 165;
      const right = 850;
      const usableWidth = right - left - 126;
      const noteSpacing = notes.length > 1 ? usableWidth / (notes.length - 1) : 0;
      const top = STAFF_TOP;
      const step = STEP;
      const clef = CLEFS[state.clef];
      svg.setAttribute("viewBox", "0 0 900 360");
      svg.style.minWidth = "";

      for (let i = 0; i < 5; i += 1) {
        const y = top + i * step * 2;
        svg.appendChild(createSvgElement("line", {
          x1: left,
          y1: y,
          x2: right,
          y2: y,
          stroke: "#111827",
          "stroke-width": 2
        }));
      }

      svg.appendChild(createSvgElement("text", {
        x: clef.symbolX,
        y: clef.symbolY,
        "font-size": clef.symbolSize,
        "font-family": "Georgia, 'Times New Roman', serif",
        fill: "#111827"
      }, clef.symbol));

      svg.appendChild(createSvgElement("text", {
        x: width / 2,
        y: 48,
        "text-anchor": "middle",
        "font-size": 22,
        "font-weight": 800,
        fill: "#344054"
      }, "篩選出的音符、音名與唱名"));

      notes.forEach((note, index) => {
        const noteX = left + 64 + index * noteSpacing;
        const noteY = top + (8 - note.staffIndex) * step;
        const isDense = notes.length > 10;
        const parts = labelParts(note);
        const labelX = noteX + (isDense ? 18 : 28);
        const labelY = noteY < 92 ? noteY + 34 : noteY - 4;
        const longestLabel = parts.reduce((max, item) => Math.max(max, item.length), 0);
        const labelWidth = Math.max(20, longestLabel * 7 + 10);
        const labelHeight = parts.length > 1 ? 39 : 22;
        const noteRx = isDense ? 14 : 18;
        const noteRy = isDense ? 10 : 12;
        const letterSize = isDense ? 13 : 15;
        const solfegeSize = isDense ? 12 : 14;
        const group = createSvgElement("g", {
          class: "learn-note",
          role: "button",
          tabindex: "0",
          "aria-label": `播放 ${note.letter} ${note.solfege}`
        });
        group.addEventListener("click", () => {
          playNote(note);
          els.feedback.className = "feedback ok";
          els.feedback.textContent = `播放：${note.letter} / ${note.solfege}`;
        });
        group.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            playNote(note);
            els.feedback.className = "feedback ok";
            els.feedback.textContent = `播放：${note.letter} / ${note.solfege}`;
          }
        });
        drawLedgerLines(svg, note.staffIndex, noteX, 58, top, step);
        if (parts.length) {
          group.appendChild(createSvgElement("rect", {
            x: labelX - 5,
            y: labelY - 17,
            width: labelWidth,
            height: labelHeight,
            rx: 6,
            fill: "#ffffff",
            opacity: "0.92"
          }));
        }
        group.appendChild(createSvgElement("ellipse", {
          cx: noteX,
          cy: noteY,
          rx: noteRx,
          ry: noteRy,
          transform: `rotate(-18 ${noteX} ${noteY})`,
          fill: "#111827"
        }));
        parts.forEach((part, partIndex) => {
          const isLetter = part === note.letter;
          group.appendChild(createSvgElement("text", {
            x: labelX,
            y: labelY + partIndex * 18,
            "text-anchor": "start",
            "font-size": isLetter ? letterSize : solfegeSize,
            "font-weight": isLetter ? 900 : 800,
            fill: isLetter ? "#2563eb" : "#475467"
          }, part));
        });
        svg.appendChild(group);
      });
    }

    function renderMelodyStaff() {
      const svg = els.staffSvg;
      svg.innerHTML = "";
      svg.setAttribute("viewBox", "0 0 980 320");
      svg.style.minWidth = "";
      if (!state.melody.length) {
        svg.appendChild(createSvgElement("text", {
          x: 490,
          y: 160,
          "text-anchor": "middle",
          "font-size": 22,
          "font-weight": 800,
          fill: "#667085"
        }, "按「產生旋律」開始 4 小節練習"));
        return;
      }

      const left = 182;
      const right = 930;
      const top = 126;
      const step = 13;
      const measureWidth = (right - left) / 4;
      const clef = CLEFS[state.clef];

      svg.appendChild(createSvgElement("text", {
        x: 490,
        y: 48,
        "text-anchor": "middle",
        "font-size": 23,
        "font-weight": 900,
        fill: "#1f2937"
      }, "4 小節旋律練習"));

      for (let i = 0; i < 5; i += 1) {
        const y = top + i * step * 2;
        svg.appendChild(createSvgElement("line", {
          x1: left,
          y1: y,
          x2: right,
          y2: y,
          stroke: "#111827",
          "stroke-width": 2
        }));
      }

      svg.appendChild(createSvgElement("text", {
        x: 70,
        y: state.clef === "treble" ? 226 : 198,
        "font-size": clef.symbolSize,
        "font-family": "Georgia, 'Times New Roman', serif",
        fill: "#111827"
      }, clef.symbol));

      svg.appendChild(createSvgElement("text", {
        x: 136,
        y: top + 22,
        "text-anchor": "middle",
        "font-size": 27,
        "font-family": "Georgia, 'Times New Roman', serif",
        "font-weight": 700,
        fill: "#111827"
      }, "4"));

      svg.appendChild(createSvgElement("text", {
        x: 136,
        y: top + 50,
        "text-anchor": "middle",
        "font-size": 27,
        "font-family": "Georgia, 'Times New Roman', serif",
        "font-weight": 700,
        fill: "#111827"
      }, "4"));

      for (let measure = 0; measure <= 4; measure += 1) {
        const x = left + measure * measureWidth;
        svg.appendChild(createSvgElement("line", {
          x1: x,
          y1: top,
          x2: x,
          y2: top + step * 8,
          stroke: "#111827",
          "stroke-width": measure === 4 ? 3.5 : 1.9
        }));
      }

      svg.appendChild(createSvgElement("line", {
        x1: right - 7,
        y1: top,
        x2: right - 7,
        y2: top + step * 8,
        stroke: "#111827",
        "stroke-width": 1.7
      }));

      state.melody.forEach((item, index) => {
        const note = item.note;
        const noteX = left + item.measure * measureWidth + 28 + (item.beat + item.duration * 0.42) / 4 * (measureWidth - 56);
        const noteY = top + (8 - note.staffIndex) * step;
        const isCurrent = index === state.melodyIndex;
        const isPlayback = index === state.playbackIndex;
        const stemUp = note.staffIndex <= 4;
        const stemX = stemUp ? noteX + 14 : noteX - 14;
        const stemEndY = stemUp ? noteY - 62 : noteY + 62;
        const noteGroup = createSvgElement("g", {
          class: "melody-note",
          "aria-label": `${note.letter} ${note.solfege}`
        });

        drawLedgerLines(svg, note.staffIndex, noteX, 48, top, step);
        if (isCurrent || isPlayback) {
          noteGroup.appendChild(createSvgElement("ellipse", {
            cx: noteX,
            cy: noteY,
            rx: 27,
            ry: 20,
            fill: isPlayback ? "#fef3c7" : "#dbeafe",
            stroke: isPlayback ? "#f59e0b" : "#2563eb",
            "stroke-width": 3.2
          }));
        }

        noteGroup.appendChild(createSvgElement("ellipse", {
          cx: noteX,
          cy: noteY,
          rx: 17,
          ry: 11.5,
          transform: `rotate(-18 ${noteX} ${noteY})`,
          fill: item.duration === 2 ? "#ffffff" : "#111827",
          stroke: "#111827",
          "stroke-width": item.duration === 2 ? 2.8 : 2
        }));
        noteGroup.appendChild(createSvgElement("line", {
          x1: stemX,
          y1: noteY,
          x2: stemX,
          y2: stemEndY,
          stroke: "#111827",
          "stroke-width": 2.5,
          "stroke-linecap": "round"
        }));
        svg.appendChild(noteGroup);
      });
    }

    function drawLedgerLines(svg, index, noteX, halfWidth, top, step) {
      const ledgerIndexes = [];
      if (index < 0) {
        for (let i = 0; i >= index; i -= 2) ledgerIndexes.push(i);
      }
      if (index > 8) {
        for (let i = 10; i <= index; i += 2) ledgerIndexes.push(i);
      }
      ledgerIndexes.forEach(ledgerIndex => {
        const y = top + (8 - ledgerIndex) * step;
        svg.appendChild(createSvgElement("line", {
          x1: noteX - halfWidth / 2,
          y1: y,
          x2: noteX + halfWidth / 2,
          y2: y,
          stroke: "#111827",
          "stroke-width": step < 10 ? 1.4 : 2
        }));
      });
    }

    function renderKeyboard(notes) {
      const unique = [...new Map(notes.map(note => [note.key, note])).values()]
        .sort((a, b) => a.midi - b.midi);
      const whiteNotes = unique.filter(note => !note.isBlack);
      const whiteIndexByMidi = new Map(whiteNotes.map((note, index) => [note.midi, index]));
      const viewportWidth = els.keyboard.clientWidth || 0;
      const keyboardWidth = whiteNotes.length * WHITE_KEY_WIDTH;
      const centerOffset = viewportWidth ? Math.max(0, (viewportWidth - keyboardWidth) / 2) : 0;
      const inner = document.createElement("div");
      inner.className = "keyboard-inner";
      inner.style.width = `${Math.max(centerOffset + keyboardWidth, 1)}px`;
      els.keyboard.innerHTML = "";

      whiteNotes.forEach((note, index) => {
        const key = document.createElement("button");
        key.type = "button";
        key.className = "piano-key white-key";
        key.style.left = `${centerOffset + index * WHITE_KEY_WIDTH}px`;
        key.dataset.key = note.key;
        key.dataset.midi = note.midi;
        key.setAttribute("aria-label", `${note.solfege} ${note.octave}`);
        key.innerHTML = `<span class="key-label">${note.solfege}<span class="key-octave">${note.octave}</span></span>`;
        key.addEventListener("click", () => checkAnswer(note, key));
        inner.appendChild(key);
      });

      unique.filter(note => note.isBlack).forEach(note => {
        const previousWhiteIndex = whiteIndexByMidi.get(note.midi - 1);
        const nextWhiteIndex = whiteIndexByMidi.get(note.midi + 1);
        const anchorIndex = previousWhiteIndex ?? (typeof nextWhiteIndex === "number" ? nextWhiteIndex - 1 : null);
        if (anchorIndex === null) return;
        const key = document.createElement("button");
        key.type = "button";
        key.className = "piano-key black-key";
        key.style.left = `${centerOffset + anchorIndex * WHITE_KEY_WIDTH + WHITE_KEY_WIDTH - BLACK_KEY_WIDTH / 2}px`;
        key.dataset.key = note.key;
        key.dataset.midi = note.midi;
        key.setAttribute("aria-label", `${note.display} ${note.octave}`);
        key.innerHTML = `<span class="key-label">${note.display}<span class="key-octave">${note.octave}</span></span>`;
        key.addEventListener("click", () => checkAnswer(note, key));
        inner.appendChild(key);
      });

      els.keyboard.appendChild(inner);
      els.keyboard.scrollLeft = 0;
      els.keyboardHint.textContent = unique.length
        ? `目前音域 ${whiteNotes.length} 個白鍵，整組置中顯示`
        : "請調整音域條件";
    }

    function renderNoteOptions() {
      els.noteOptions.innerHTML = "";
      SOLFEGE.forEach(name => {
        const label = document.createElement("label");
        label.innerHTML = `<input type="checkbox" value="${name}" ${state.selectedClasses.has(name) ? "checked" : ""}> <span>${name}</span>`;
        label.querySelector("input").addEventListener("change", event => {
          if (event.target.checked) {
            state.selectedClasses.add(name);
          } else {
            state.selectedClasses.delete(name);
          }
          if (state.selectedClasses.size === 0) state.selectedClasses.add(name);
          stopMelodyPlayback();
          state.filter = "custom";
          state.current = null;
          state.melody = [];
          state.melodyIndex = 0;
          setActiveButtons("[data-filter]", "custom", "filter");
          refresh();
        });
        els.noteOptions.appendChild(label);
      });
    }

    function renderLearn(notes) {
      els.learnGrid.innerHTML = "";
      if (!notes.length) {
        els.learnGrid.innerHTML = '<div class="empty">目前沒有符合條件的音符，請放寬音域或篩選。</div>';
        return;
      }
      const showLabels = state.labelMode !== "none";
      notes.forEach(note => {
        const card = document.createElement("article");
        card.className = "learn-card";
        card.tabIndex = 0;
        card.setAttribute("role", "button");
        card.setAttribute("aria-label", `播放 ${note.letter} ${note.solfege}`);
        card.addEventListener("click", () => {
          playNote(note);
          els.feedback.className = "feedback ok";
          els.feedback.textContent = `播放：${note.letter} / ${note.solfege}`;
        });
        card.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            card.click();
          }
        });
        const typeText = note.staffType === "line" ? "線上音符" : "間上音符";
        const labelText = labelParts(note).join(" / ");
        card.insertAdjacentHTML("beforeend", `<strong>${showLabels ? labelText : "點擊播放"}</strong><span>${typeText}</span>`);
        els.learnGrid.appendChild(card);
      });
    }

    function nextQuestion() {
      clearTimeout(state.timer);
      stopMelodyPlayback();
      const notes = visibleNotes();
      if (!notes.length) {
        state.current = null;
        els.staffSvg.innerHTML = "";
        els.feedback.className = "feedback bad";
        els.feedback.textContent = "目前沒有符合條件的題目，請調整音域或音符篩選。";
        updateStats(notes);
        return;
      }
      const lastKey = state.current && state.current.key;
      let next = notes[Math.floor(Math.random() * notes.length)];
      if (notes.length > 1) {
        while (next.key === lastKey) {
          next = notes[Math.floor(Math.random() * notes.length)];
        }
      }
      state.current = next;
      renderStaff(next);
      els.feedback.className = "feedback";
      els.feedback.textContent = "請在下方鋼琴鍵盤點出這個音。";
      updateStats(notes);
    }

    function checkMelodyAnswer(note, keyEl) {
      if (!state.melody.length || state.melodyIndex >= state.melody.length) return;
      const target = state.melody[state.melodyIndex].note;
      playNote(note);
      state.tries += 1;
      document.querySelectorAll(".piano-key").forEach(key => key.classList.remove("pressed"));
      keyEl.classList.add("pressed");
      if (note.key === target.key) {
        state.score += 1;
        state.melodyIndex += 1;
        state.current = state.melody[state.melodyIndex]?.note || null;
        renderMelodyStaff();
        if (state.melodyIndex >= state.melody.length) {
          els.feedback.className = "feedback ok";
          els.feedback.textContent = "太好了，4 小節旋律完成！可以再產生一段新的旋律。";
        } else {
          els.feedback.className = "feedback ok";
          els.feedback.textContent = `答對了，下一個音是 ${state.current.solfege}。`;
        }
      } else {
        els.feedback.className = "feedback bad";
        els.feedback.textContent = `再試一次。你點的是 ${note.display || note.solfege}，目前要彈的是 ${target.solfege}。`;
      }
      updateStats(visibleNotes());
    }

    function checkAnswer(note, keyEl) {
      if (state.mode !== "practice" || !state.current) return;
      if (state.practiceType === "melody") {
        checkMelodyAnswer(note, keyEl);
        return;
      }
      playNote(note);
      state.tries += 1;
      document.querySelectorAll(".piano-key").forEach(key => key.classList.remove("pressed"));
      keyEl.classList.add("pressed");
      if (note.key === state.current.key) {
        state.score += 1;
        els.feedback.className = "feedback ok";
        els.feedback.textContent = `答對了：${state.current.solfege}，下一題準備中。`;
        updateStats(visibleNotes());
        state.timer = setTimeout(nextQuestion, 720);
      } else {
        els.feedback.className = "feedback bad";
        els.feedback.textContent = `再試一次。你點的是 ${note.display || note.solfege}，目前題目不是這個音。`;
        updateStats(visibleNotes());
      }
    }

    function updateStats(notes) {
      els.scoreText.textContent = state.score;
      els.tryText.textContent = state.tries;
      els.poolText.textContent = notes.length;
      els.rangeValue.textContent = state.ledger === 0 ? "五線內" : `上下 ${state.ledger} 線`;
    }

    function updateHeader() {
      const modeText = state.mode === "practice" ? "練習" : "學習";
      const practiceTypeText = state.mode === "practice" && state.practiceType === "melody" ? "旋律" : "";
      els.pageTitle.textContent = `${CLEFS[state.clef].label}${practiceTypeText}${modeText}`;
      els.pageSubtitle.textContent = state.mode === "practice"
        ? (state.practiceType === "melody" ? "先聽 4 小節旋律，再依序在鋼琴鍵盤彈出高亮音。" : "請看上方音符，並在下方鋼琴鍵盤點出相同音。")
        : "目前列出所有符合篩選條件的音符與 Do Re Mi 名稱。";
      els.practiceToolbar.classList.toggle("hidden", state.mode !== "practice");
      els.nextBtn.classList.toggle("hidden", state.mode !== "practice" || state.practiceType !== "single");
      els.generateMelodyBtn.classList.toggle("hidden", state.mode !== "practice" || state.practiceType !== "melody");
      els.playMelodyBtn.classList.toggle("hidden", state.mode !== "practice" || state.practiceType !== "melody");
      els.stopMelodyBtn.classList.toggle("hidden", state.mode !== "practice" || state.practiceType !== "melody");
      els.keyboardPanel.classList.toggle("hidden", state.mode !== "practice");
      els.learnGrid.classList.toggle("hidden", state.mode !== "learn");
      els.labelToggle.classList.toggle("hidden", state.mode !== "learn");
    }

    function refresh() {
      const notes = visibleNotes();
      updateHeader();
      updateStats(notes);
      renderKeyboard(keyboardNotes());
      renderNoteOptions();
      if (state.mode === "practice") {
        if (state.practiceType === "melody") {
          if (!state.melody.length || !state.melody.some(item => notes.some(note => note.key === item.note.key))) {
            generateMelody();
          } else {
            state.current = state.melody[state.melodyIndex]?.note || null;
            renderMelodyStaff();
          }
        } else if (!state.current || !notes.some(note => note.key === state.current.key)) {
          nextQuestion();
        } else {
          renderStaff(state.current);
        }
      } else {
        state.current = notes[0] || null;
        if (state.current) renderLearnStaff(notes);
        else els.staffSvg.innerHTML = "";
        renderLearn(notes);
        els.feedback.className = "feedback";
        els.feedback.textContent = notes.length ? `目前共有 ${notes.length} 個音符可以學習。` : "目前沒有符合條件的音符。";
      }
    }

    function setActiveButtons(selector, value, key) {
      document.querySelectorAll(selector).forEach(button => {
        button.classList.toggle("active", button.dataset[key] === value);
      });
    }

    function bindControls() {
      document.querySelectorAll("[data-clef]").forEach(button => {
        button.addEventListener("click", () => {
          stopMelodyPlayback();
          state.clef = button.dataset.clef;
          state.current = null;
          state.melody = [];
          state.melodyIndex = 0;
          setActiveButtons("[data-clef]", state.clef, "clef");
          refresh();
        });
      });

      document.querySelectorAll("[data-mode]").forEach(button => {
        button.addEventListener("click", () => {
          stopMelodyPlayback();
          state.mode = button.dataset.mode;
          setActiveButtons("[data-mode]", state.mode, "mode");
          refresh();
        });
      });

      document.querySelectorAll("[data-practice-type]").forEach(button => {
        button.addEventListener("click", () => {
          stopMelodyPlayback();
          state.practiceType = button.dataset.practiceType;
          state.current = null;
          state.melody = [];
          state.melodyIndex = 0;
          setActiveButtons("[data-practice-type]", state.practiceType, "practiceType");
          refresh();
        });
      });

      document.querySelectorAll("[data-filter]").forEach(button => {
        button.addEventListener("click", () => {
          stopMelodyPlayback();
          state.filter = button.dataset.filter;
          state.current = null;
          state.melody = [];
          state.melodyIndex = 0;
          setActiveButtons("[data-filter]", state.filter, "filter");
          refresh();
        });
      });

      els.range.addEventListener("input", event => {
        stopMelodyPlayback();
        state.ledger = Number(event.target.value);
        state.current = null;
        state.melody = [];
        state.melodyIndex = 0;
        refresh();
      });

      els.nextBtn.addEventListener("click", nextQuestion);
      els.generateMelodyBtn.addEventListener("click", generateMelody);
      els.playMelodyBtn.addEventListener("click", playMelody);
      els.stopMelodyBtn.addEventListener("click", () => {
        stopMelodyPlayback();
        renderMelodyStaff();
        els.feedback.className = "feedback";
        els.feedback.textContent = "已停止播放，可以繼續自己彈奏。";
      });
      els.resetBtn.addEventListener("click", () => {
        stopMelodyPlayback();
        state.score = 0;
        state.tries = 0;
        if (state.practiceType === "melody") {
          state.melodyIndex = 0;
          state.current = state.melody[0]?.note || null;
          renderMelodyStaff();
        }
        els.feedback.className = "feedback";
        els.feedback.textContent = "分數已重設，繼續練習吧。";
        updateStats(visibleNotes());
      });

      document.querySelectorAll("[data-label-mode]").forEach(button => {
        button.addEventListener("click", () => {
          state.labelMode = button.dataset.labelMode;
          setActiveButtons("[data-label-mode]", state.labelMode, "labelMode");
          if (state.mode === "learn") {
            refresh();
          }
        });
      });
    }

    bindControls();
    renderNoteOptions();
    refresh();
  </script>
</body>
</html>
